# Ambiente isolado: não reutiliza volumes, rede ou contas da aplicação.
name: receitas_test
services:
  db-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: receitas_test
      MYSQL_USER: receitas_test
      MYSQL_PASSWORD: receitas_test
      MYSQL_ROOT_PASSWORD: test_root
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
