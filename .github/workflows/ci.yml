name: Verificação
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: receitas_test
          MYSQL_USER: receitas_test
          MYSQL_PASSWORD: receitas_test
          MYSQL_ROOT_PASSWORD: test_root
        ports: ['3307:3306']
        options: >-
          --health-cmd="MYSQL_PWD=receitas_test mysql -h 127.0.0.1 -ureceitas_test -D receitas_test -e 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_NAME: receitas_test
      DB_USER: receitas_test
      DB_PASSWORD: receitas_test
      TEST_DB_PORT: 3307
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
